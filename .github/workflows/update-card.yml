name: Update profile card

on:
  schedule:
    - cron: "17 6 * * *"     # daily, ~1 AM Houston time
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SVGs with live stats
        env:
          # Personal token (optional) adds private repos/commits; falls back to the built-in token (public only)
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          USER_NAME: ${{ github.repository_owner }}
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg README.md cache/
          git diff --cached --quiet || (git commit -m "Update profile card" && git push)
